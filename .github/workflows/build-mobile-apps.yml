name: Build Handi-pro Mobile App (Android APK & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package.json'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Preinstalled Android SDK & Accept Licences
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci

      - name: Sync Web Assets & Capacitor
        working-directory: ./app
        run: |
          node sync-www.js
          node generate-assets.js
          npx cap sync android

      - name: Make Gradlew Executable
        working-directory: ./app/android
        run: chmod +x ./gradlew

      - name: Build Android Release / Debug APK
        working-directory: ./app/android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: handipro-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App (Archive)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package.json'

      - name: Install App Dependencies
        working-directory: ./app
        run: npm ci

      - name: Sync Web Assets & Capacitor
        working-directory: ./app
        run: |
          node sync-www.js
          node generate-assets.js
          npx cap sync ios

      - name: Build iOS Workspace
        working-directory: ./app/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: handipro-ios-app
          path: app/ios/App/build/Release-iphoneos/
